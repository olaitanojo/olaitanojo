name: GitHub Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: profile-metrics
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: olaitanojo
          template: classic
          base: header, community, repositories, metadata
          config_timezone: America/New_York
          config_retries: 1
          config_retries_delay: 60
          # Recent activity, line history, and language analysis are disabled because the current action image cannot handle deleted or incomplete GitHub event metadata.

      - name: Verify generated metrics
        run: |
          if [ -f "github-metrics.svg" ]; then
            echo "Metrics file generated successfully"
            ls -la github-metrics.svg
          else
            echo "Metrics file not found"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: true
          enable_jekyll: false
          allow_empty_commit: false
          force_orphan: false

      - name: Generate summary
        if: always()
        run: |
          echo "## GitHub Metrics Generation Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "github-metrics.svg" ]; then
            echo "Metrics generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "File size: $(du -h github-metrics.svg | cut -f1)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Metrics generation failed" >> $GITHUB_STEP_SUMMARY
          fi